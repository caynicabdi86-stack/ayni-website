<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to Ayni's personal website.">
  <title>AYNI | My Little World</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #71334f;
      background: linear-gradient(135deg, #ffe2ef, #f8b8d2, #fff0f6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 440px);
      background: rgba(255,255,255,.88);
      border: 2px solid #fff;
      border-radius: 28px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 14px 40px rgba(160, 63, 111, .16);
    }
    .tag {
      display: inline-block;
      background: #ffe0ed;
      color: #a43e70;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: bold;
    }
    h1 {
      margin: 16px 0 8px;
      color: #b33e78;
      font-size: clamp(34px, 9vw, 48px);
      letter-spacing: 2px;
    }
    .photo {
      width: 190px;
      height: 220px;
      object-fit: cover;
      object-position: center;
      border-radius: 24px;
      border: 5px solid #ffd2e5;
      margin: 16px auto;
      display: block;
    }
    h2 { color: #a43e70; margin: 12px 0; }
    p { line-height: 1.7; font-size: 16px; }
    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      border-radius: 999px;
      color: white;
      background: #d85b96;
      text-decoration: none;
      font-weight: bold;
    }
    .footer { margin-top: 24px; font-size: 12px; color: #a66b88; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">WELCOME TO MY WEBSITE</span>
    <h1>AYNI 🎀</h1>
    <img class="photo" src="ayni-photo.jpg" alt="Ayni's profile photo">
    <h2>Hello, I'm Ayni! 🩷</h2>
    <p>Welcome to my little world. I'm learning web development and this is my first personal website. Thank you for visiting!</p>
    <a class="button" href="mailto:">Say Hello 💌</a>
    <div class="footer">Made with love by Ayni · 🩷</div>
  </main>
</body>
</html>
